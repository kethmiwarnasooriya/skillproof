spring.application.name=api

# Secrets come from environment variables. For local dev they are loaded from backend/.env
# (git-ignored, see .env.example). Real environment variables override .env values.
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillproof_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OpenAI. The key comes ONLY from the OPENAI_API_KEY environment variable (or the git-ignored backend/.env)
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.connect-timeout=5s
openai.read-timeout=45s
openai.max-completion-tokens=800

# Certificate analysis limits (cost control and abuse protection)
app.certificates.max-submissions-per-hour=10
app.certificates.max-text-length=8000
app.certificates.min-page-text-length=200
app.certificates.min-pasted-text-length=50
app.certificates.fetch-timeout=10s
app.certificates.max-page-size=2MB

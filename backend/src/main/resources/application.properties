spring.application.name=api

# Secrets come from environment variables. For local dev they are loaded from backend/.env
# (git-ignored, see .env.example). Real environment variables override .env values.
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillproof_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
